name: BasedAgents live task probe
on:
  push:
    branches: [basedagents-live-probe]
    paths: ['.github/workflows/basedagents-live-probe.yml']
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: basedagents-live-probe }
      - shell: bash
        run: |
          set -euo pipefail
          mkdir -p data
          python - <<'PY'
          import urllib.request,json,datetime
          urls=[
            'https://api.basedagents.ai/v1/tasks?status=open&min_usdc=0.01&limit=100',
            'https://api.basedagents.ai/v1/status',
            'https://api.basedagents.ai/v1/tasks/settled?limit=20'
          ]
          out={'at':datetime.datetime.now(datetime.timezone.utc).isoformat(),'results':[]}
          for url in urls:
            try:
              req=urllib.request.Request(url,headers={'User-Agent':'50M-basedagents-probe/1.0','Accept':'application/json'})
              with urllib.request.urlopen(req,timeout=30) as r:
                raw=r.read().decode('utf-8','replace')
                try:data=json.loads(raw)
                except:data={'raw':raw[:40000]}
                out['results'].append({'url':url,'status':r.status,'data':data})
            except Exception as e: out['results'].append({'url':url,'error':repr(e)})
          open('data/basedagents-live.json','w').write(json.dumps(out,indent=2))
          print(json.dumps(out,indent=2)[:50000])
          PY
      - run: |
          git config user.name "50M live probe"
          git config user.email "actions@users.noreply.github.com"
          git add data/basedagents-live.json
          git diff --cached --quiet && exit 0
          git commit -m "chore: record BasedAgents live task inventory"
          git push origin HEAD:basedagents-live-probe
