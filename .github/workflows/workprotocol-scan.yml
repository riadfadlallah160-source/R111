name: Live WorkProtocol Scan
on:
  push:
    paths:
      - '.github/workflows/workprotocol-scan.yml'
  workflow_dispatch:
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch live open-job feed
        run: |
          set -euo pipefail
          code=$(curl --show-error --silent -L -o /tmp/feed -D /tmp/headers -w '%{http_code}' 'https://workprotocol.ai/api/jobs/feed')
          echo HTTP_STATUS=$code
          cat /tmp/headers
          echo FEED_BEGIN
          head -c 30000 /tmp/feed
          echo
          echo FEED_END
          test "$code" = "200"