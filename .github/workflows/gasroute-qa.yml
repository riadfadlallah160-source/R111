name: GasRoute QA
on:
  push:
    paths:
      - '.github/workflows/gasroute-qa.yml'
      - 'market.js'
  workflow_dispatch:
jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Render
        run: sleep 15
      - name: Verify live preview
        run: |
          set -euo pipefail
          curl --show-error --silent --retry 2 --retry-delay 2 'https://fifty-million-agent-gateway.onrender.com/v1/market/gasroute-oracle-preview?chain_set=ethereum%2Cbsc%2Cpolygon&calldata_size_bytes=128&gas_units_est=100000' | tee /tmp/preview.json
          python -c "import json; d=json.load(open('/tmp/preview.json')); assert d['preview'] is True; assert d['chain'] in {'ethereum','bsc','polygon'}; assert isinstance(d['fee_usd'],(int,float)) and d['fee_usd']>=0; assert len(d['quotes'])>=2; assert all(q['gas_price_wei'] for q in d['quotes']); print('PREVIEW_OK',json.dumps(d,separators=(',',':')))"
      - name: Verify x402 challenge
        run: |
          set -euo pipefail
          code=$(curl --show-error --silent -o /tmp/paid.json -D /tmp/headers.txt -w '%{http_code}' -X POST 'https://fifty-million-agent-gateway.onrender.com/v1/market/gasroute-oracle' -H 'content-type: application/json' --data '{"chain_set":["ethereum","bsc","polygon"],"calldata_size_bytes":128,"gas_units_est":100000}')
          cat /tmp/headers.txt
          cat /tmp/paid.json
          test "$code" = "402"
          grep -qi '^payment-required:' /tmp/headers.txt
          python -c "import json; d=json.load(open('/tmp/paid.json')); assert d.get('x402Version'); assert d.get('accepts'); print('X402_OK')"
# QA rerun after Render live
