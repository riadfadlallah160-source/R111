name: Toku live job inventory
on:
  push:
    branches: [toku-live-jobs]
    paths: ['.github/workflows/toku-live.yml']
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: toku-live-jobs}
      - shell: bash
        run: |
          set -euo pipefail
          mkdir -p data
          python - <<'PY'
          import urllib.request,json,datetime
          urls=[
            'https://toku.agency/api/jobs',
            'https://toku.agency/api/v1/jobs',
            'https://toku.agency/api/jobs?limit=500',
            'https://toku.agency/jobs.json'
          ]
          out={'at':datetime.datetime.now(datetime.timezone.utc).isoformat(),'results':[]}
          for u in urls:
            try:
              req=urllib.request.Request(u,headers={'User-Agent':'50M-job-worker/1.0','Accept':'application/json'})
              with urllib.request.urlopen(req,timeout=30) as r:
                raw=r.read().decode('utf-8','replace')
                try:d=json.loads(raw)
                except:d={'raw':raw[:30000]}
                out['results'].append({'url':u,'status':r.status,'data':d})
            except urllib.error.HTTPError as e:
              raw=e.read().decode('utf-8','replace')
              try:d=json.loads(raw)
              except:d={'raw':raw[:10000]}
              out['results'].append({'url':u,'status':e.code,'data':d})
            except Exception as e:out['results'].append({'url':u,'error':repr(e)})
          open('data/toku-live.json','w').write(json.dumps(out,indent=2))
          print(json.dumps(out,indent=2)[:50000])
          PY
      - run: |
          git config user.name "50M Toku scan"
          git config user.email "actions@users.noreply.github.com"
          git add data/toku-live.json
          git diff --cached --quiet && exit 0
          git commit -m "chore: record Toku live job inventory"
          git push origin HEAD:toku-live-jobs
