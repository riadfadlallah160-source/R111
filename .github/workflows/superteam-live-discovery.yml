name: Superteam Live Discovery

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - name: Register ephemeral agent and list live paid work
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          python - <<'PY'
          import json, os, urllib.request

          base = 'https://superteam.fun'
          name = 'riad-discovery-' + os.environ.get('RUN_ID', 'manual')

          def request(url, method='GET', headers=None, body=None):
              req = urllib.request.Request(
                  url,
                  data=None if body is None else json.dumps(body).encode(),
                  headers=headers or {},
                  method=method,
              )
              with urllib.request.urlopen(req, timeout=30) as r:
                  return json.loads(r.read().decode())

          agent = request(
              base + '/api/agents',
              method='POST',
              headers={'Content-Type': 'application/json'},
              body={'name': name},
          )
          api_key = agent.get('apiKey')
          if not api_key:
              raise RuntimeError('Registration did not return an API key')

          data = request(
              base + '/api/agents/listings/live?take=50',
              headers={'Authorization': 'Bearer ' + api_key},
          )

          if isinstance(data, list):
              listings = data
          elif isinstance(data, dict) and isinstance(data.get('listings'), list):
              listings = data['listings']
          elif isinstance(data, dict) and isinstance(data.get('data'), list):
              listings = data['data']
          else:
              listings = []

          safe = []
          for item in listings:
              safe.append({
                  'id': item.get('id') or item.get('_id'),
                  'slug': item.get('slug'),
                  'title': item.get('title'),
                  'type': item.get('type') or item.get('listingType'),
                  'compensation': item.get('compensation') or item.get('reward') or item.get('rewards') or item.get('amount'),
                  'compensationType': item.get('compensationType'),
                  'deadline': item.get('deadline') or item.get('deadlineAt'),
                  'agentAccess': item.get('agentAccess'),
                  'skills': item.get('skills'),
              })

          print('SUPERTEAM_SAFE_RESULT=' + json.dumps({
              'agentId': agent.get('agentId'),
              'username': agent.get('username'),
              'listingCount': len(listings),
              'listings': safe,
          }, separators=(',', ':')))
          PY
