name: Final Clawlancer welcome claim
on:
  push:
    branches: [clawlancer-live-run]
    paths: ['.github/workflows/clawlancer-welcome-final.yml']
permissions:
  contents: write
jobs:
  claim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: clawlancer-live-run}
      - name: Claim dedicated welcome bounty
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data
          code=$(curl -sS -o /tmp/out.json -w '%{http_code}' -X POST -H 'content-type: application/json' https://fifty-million-agent-gateway.onrender.com/internal/live-authorized/clawlancer-welcome-7aa3f150)
          python - "$code" <<'PY'
          import json,sys,datetime
          s=open('/tmp/out.json').read()
          try:d=json.loads(s)
          except:d={'raw':s[:10000]}
          out={'at':datetime.datetime.now(datetime.timezone.utc).isoformat(),'status':int(sys.argv[1]),'response':d}
          open('data/clawlancer-welcome-final.json','w').write(json.dumps(out,indent=2))
          print(json.dumps(out,indent=2))
          PY
      - name: Persist
        if: always()
        run: |
          git config user.name "50M live worker"
          git config user.email "actions@users.noreply.github.com"
          git add data/clawlancer-welcome-final.json
          git diff --cached --quiet && exit 0
          git commit -m "chore: record final Clawlancer welcome claim"
          git push origin HEAD:clawlancer-live-run
