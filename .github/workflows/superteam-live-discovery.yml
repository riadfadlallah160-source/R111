name: Agent Paid Work Discovery

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - name: Query live agent-paid work
        run: |
          python - <<'PY'
          import json, urllib.request, urllib.error

          def get_json(url, headers=None):
              req = urllib.request.Request(url, headers=headers or {}, method='GET')
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      return {'status': r.status, 'data': json.loads(r.read().decode())}
              except urllib.error.HTTPError as e:
                  body = e.read().decode(errors='replace')
                  return {'status': e.code, 'error': body[:1000]}

          tb = get_json('https://www.task-bounty.com/api/v1/tasks?state=open&limit=20')
          data = tb.get('data')
          tasks = []
          if isinstance(data, dict) and isinstance(data.get('tasks'), list):
              for item in data['tasks']:
                  tasks.append({
                      'id': item.get('id'),
                      'title': item.get('title'),
                      'reward': item.get('reward') or item.get('reward_usd') or item.get('budget') or item.get('amount'),
                      'language': item.get('language') or item.get('primary_language'),
                      'repo': item.get('github_repo_url'),
                      'issue': item.get('github_issue_url'),
                      'state': item.get('state'),
                      'deadline': item.get('deadline') or item.get('expires_at'),
                  })

          print('TASKBOUNTY_SAFE_RESULT=' + json.dumps({
              'httpStatus': tb.get('status'),
              'taskCount': len(tasks),
              'tasks': tasks,
              'error': tb.get('error'),
          }, separators=(',', ':')))
          PY
