name: uGig live buyer inventory
on:
  push:
    branches: [ugig-live-probe]
    paths: ['.github/workflows/ugig-live.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ugig-live-probe
      - name: Scan public gigs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data
          python - <<'PY'
          import json, urllib.request, urllib.parse, datetime
          base='https://ugig.net/api/gigs'
          allrows=[]
          pages=[]
          for page in range(1,11):
            url=base+'?'+urllib.parse.urlencode({'page':page,'limit':100})
            try:
              req=urllib.request.Request(url,headers={'User-Agent':'50M-live-buyer-scan/1.0','Accept':'application/json'})
              with urllib.request.urlopen(req,timeout=30) as r:
                data=json.loads(r.read().decode())
              pages.append({'page':page,'status':r.status,'shape':type(data).__name__})
              rows=data.get('gigs',data.get('data',data if isinstance(data,list) else []))
              if not isinstance(rows,list): rows=[]
              allrows.extend(rows)
              if len(rows)<100: break
            except Exception as e:
              pages.append({'page':page,'error':repr(e)}); break
          def n(v):
            try:return float(v)
            except:return 0
          candidates=[]
          for g in allrows:
            hi=max(n(g.get('budget_max')),n(g.get('budget_min')),n(g.get('fixed_price')),n(g.get('budget')))
            title=str(g.get('title',''))
            desc=str(g.get('description',''))
            status=str(g.get('status','')).lower()
            if hi>=250 and status in ('active','open',''):
              candidates.append({
                'id':g.get('id'),'title':title,'description':desc[:2500],
                'category':g.get('category'),'skills_required':g.get('skills_required'),
                'budget_type':g.get('budget_type'),'budget_min':g.get('budget_min'),
                'budget_max':g.get('budget_max'),'fixed_price':g.get('fixed_price'),
                'payment_coin':g.get('payment_coin'),'duration':g.get('duration'),
                'location_type':g.get('location_type'),'status':g.get('status'),
                'application_count':g.get('application_count',g.get('applications_count')),
                'created_at':g.get('created_at'),'updated_at':g.get('updated_at'),
                'poster':g.get('poster',g.get('user',g.get('owner')))
              })
          candidates.sort(key=lambda x:max(n(x.get('budget_max')),n(x.get('budget_min')),n(x.get('fixed_price'))),reverse=True)
          out={'generated_at':datetime.datetime.now(datetime.timezone.utc).isoformat(),'pages':pages,'total_rows':len(allrows),'candidates':candidates[:100]}
          open('data/ugig-live.json','w').write(json.dumps(out,indent=2))
          print(json.dumps(out,indent=2)[:50000])
          PY
      - name: Persist
        run: |
          git config user.name "50M live buyer scan"
          git config user.email "actions@users.noreply.github.com"
          git add data/ugig-live.json
          git diff --cached --quiet && exit 0
          git commit -m "chore: record live uGig buyer inventory"
          git push origin HEAD:ugig-live-probe
