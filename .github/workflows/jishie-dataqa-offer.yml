name: Jishie data QA offer
on:
  push:
    branches: [jishie-demand-probe]
    paths: ['.github/workflows/jishie-dataqa-offer.yml']
permissions:
  contents: write
jobs:
  offer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: jishie-demand-probe }
      - shell: bash
        run: |
          set -euo pipefail
          mkdir -p data
          cat > /tmp/offer.mjs <<'JS'
          import crypto from 'node:crypto';
          const sort = (v) => Array.isArray(v) ? v.map(sort) : (v && typeof v === 'object') ? Object.fromEntries(Object.keys(v).sort().map(k => [k, sort(v[k])])) : v;
          const {publicKey,privateKey}=crypto.generateKeyPairSync('ed25519');
          const jwk=publicKey.export({format:'jwk'});
          const core={
            offer:'0.1',
            demand_id:'dmd_a101',
            seller:{
              domain:'fifty-million-agent-gateway.onrender.com',
              agent_card:'https://fifty-million-agent-gateway.onrender.com/.well-known/agent.json',
              index_ref:'aix_e13bf173d4'
            },
            price:{amount:0.20,currency:'USDC',model:'per_record'},
            capacity:{max_per_day:120},
            sla:{p95_ms:3000,uptime:0.99},
            settlement:{rail:'x402'},
            valid_until:'2026-10-25'
          };
          const canonical=JSON.stringify(sort(core));
          const sig=crypto.sign(null,Buffer.from(canonical),privateKey).toString('base64');
          const offer={...core,signature:{alg:'ed25519',keys_inline:{kty:'OKP',crv:'Ed25519',x:jwk.x},signed_at:new Date().toISOString(),sig}};
          const r=await fetch('https://jishie.com/v1/demands/dmd_a101/offers',{method:'POST',headers:{'content-type':'application/json','accept':'application/json','user-agent':'50M-seller/1.0'},body:JSON.stringify(offer)});
          const text=await r.text(); let data; try{data=JSON.parse(text)}catch{data={raw:text.slice(0,10000)}}
          const out={at:new Date().toISOString(),status:r.status,response:data,offer:{...core,signature:{alg:'ed25519',keys_inline:{kty:'OKP',crv:'Ed25519',x:jwk.x},signed_at:offer.signature.signed_at,sig:'[redacted-after-submission]'}}};
          await import('node:fs').then(fs=>fs.writeFileSync('data/jishie-dataqa-offer.json',JSON.stringify(out,null,2)));
          console.log(JSON.stringify(out,null,2));
          JS
          node /tmp/offer.mjs
      - run: |
          git config user.name "50M demand seller"
          git config user.email "actions@users.noreply.github.com"
          git add data/jishie-dataqa-offer.json
          git diff --cached --quiet && exit 0
          git commit -m "chore: record signed Jishie data-QA offer result"
          git push origin HEAD:jishie-demand-probe
