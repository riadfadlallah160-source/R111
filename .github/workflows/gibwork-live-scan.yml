name: Gibwork Live Scan

on:
  push:
    paths:
      - '.github/workflows/gibwork-live-scan.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch live Gibwork tasks
        run: |
          python3 - <<'PY'
          import json, urllib.request, urllib.error, datetime

          urls = [
            'https://api.gib.work/explore?page=1',
            'https://app.gib.work/api/explore'
          ]
          out = {'scanned_at': datetime.datetime.now(datetime.timezone.utc).isoformat(), 'attempts': []}
          for url in urls:
              rec = {'url': url}
              try:
                  req = urllib.request.Request(url, headers={'Accept':'application/json','User-Agent':'RiadRevenueAgent/1.0'})
                  with urllib.request.urlopen(req, timeout=30) as r:
                      raw = r.read().decode()
                      rec['http_status'] = r.status
                      try: rec['data'] = json.loads(raw)
                      except Exception: rec['raw'] = raw[:100000]
              except urllib.error.HTTPError as e:
                  rec['http_status'] = e.code
                  rec['error_body'] = e.read().decode(errors='replace')[:20000]
              except Exception as e:
                  rec['error'] = repr(e)
              out['attempts'].append(rec)
          with open('gibwork-scan.json','w') as f:
              json.dump(out,f,indent=2)
          PY
      - name: Commit scan
        run: |
          git config user.name "Riad Revenue Agent"
          git config user.email "actions@users.noreply.github.com"
          git add gibwork-scan.json
          git diff --cached --quiet && exit 0
          git commit -m "chore: refresh Gibwork live tasks"
          git push
