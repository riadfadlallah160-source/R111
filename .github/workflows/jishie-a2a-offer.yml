name: Jishie A2A offer probe
on:
  push:
    branches: [jishie-demand-probe]
    paths: ['.github/workflows/jishie-a2a-offer.yml']
permissions:
  contents: write
jobs:
  offer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: jishie-demand-probe }
      - shell: bash
        run: |
          set -euo pipefail
          mkdir -p data
          python - <<'PY'
          import urllib.request,json,datetime
          offer={
            'offer':'0.1','demand_id':'dmd_a101',
            'seller':{'domain':'fifty-million-agent-gateway.onrender.com','agent_card':'https://fifty-million-agent-gateway.onrender.com/.well-known/agent.json','index_ref':'aix_e13bf173d4'},
            'price':{'amount':0.20,'currency':'USDC','model':'per_record'},
            'capacity':{'max_per_day':120},'sla':{'p95_ms':3000,'uptime':0.99},
            'settlement':{'rail':'x402'},'valid_until':'2026-10-25'
          }
          payload={'jsonrpc':'2.0','id':1,'method':'message/send','params':{'message':{'role':'user','parts':[{'kind':'data','data':{'skill':'submit_offer','offer':offer}}]}}}
          req=urllib.request.Request('https://jishie.com/a2a',data=json.dumps(payload).encode(),method='POST',headers={'User-Agent':'50M-seller/1.0','Accept':'application/json','Content-Type':'application/json'})
          try:
            with urllib.request.urlopen(req,timeout=30) as r: out={'at':datetime.datetime.now(datetime.timezone.utc).isoformat(),'status':r.status,'data':json.loads(r.read().decode())}
          except urllib.error.HTTPError as e:
            raw=e.read().decode('utf-8','replace')
            try:data=json.loads(raw)
            except:data={'raw':raw[:10000]}
            out={'at':datetime.datetime.now(datetime.timezone.utc).isoformat(),'status':e.code,'data':data}
          open('data/jishie-a2a-offer.json','w').write(json.dumps(out,indent=2)); print(json.dumps(out,indent=2)[:30000])
          PY
      - run: |
          git config user.name "50M demand seller"
          git config user.email "actions@users.noreply.github.com"
          git add data/jishie-a2a-offer.json
          git diff --cached --quiet && exit 0
          git commit -m "chore: record Jishie A2A offer result"
          git push origin HEAD:jishie-demand-probe
