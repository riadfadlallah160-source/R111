name: Speedbot live paid-work probe
on:
  push:
    branches: [speedbot-live-probe]
    paths: ['.github/workflows/speedbot-live.yml']
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: speedbot-live-probe}
      - name: Fetch live public feeds
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data
          python - <<'PY'
          import urllib.request,json,datetime
          urls=['https://speedbot.dev/api/opportunities','https://speedbot.dev/api/topics','https://speedbot.dev/api/launch']
          out={'generated_at':datetime.datetime.now(datetime.timezone.utc).isoformat(),'results':[]}
          for u in urls:
            try:
              q=urllib.request.Request(u,headers={'User-Agent':'50M-paid-work-probe/1.0','Accept':'application/json'})
              with urllib.request.urlopen(q,timeout=30) as r:
                s=r.read().decode('utf-8','replace')
                try:d=json.loads(s)
                except:d={'raw':s[:30000]}
                out['results'].append({'url':u,'status':r.status,'data':d})
            except urllib.error.HTTPError as e:
              out['results'].append({'url':u,'status':e.code,'error':e.read().decode('utf-8','replace')[:10000]})
            except Exception as e: out['results'].append({'url':u,'error':repr(e)})
          open('data/speedbot-live.json','w').write(json.dumps(out,indent=2))
          print(json.dumps(out,indent=2)[:50000])
          PY
      - name: Persist
        run: |
          git config user.name "50M paid work probe"
          git config user.email "actions@users.noreply.github.com"
          git add data/speedbot-live.json
          git diff --cached --quiet && exit 0
          git commit -m "chore: record Speedbot live paid work"
          git push origin HEAD:speedbot-live-probe
