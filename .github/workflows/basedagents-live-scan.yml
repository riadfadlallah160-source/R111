name: BasedAgents Live Scan

on:
  push:
    paths:
      - '.github/workflows/basedagents-live-scan.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch open BasedAgents tasks
        run: |
          python3 - <<'PY'
          import json, urllib.request, urllib.error, datetime

          url = 'https://api.basedagents.ai/v1/tasks?status=open'
          result = {'scanned_at': datetime.datetime.now(datetime.timezone.utc).isoformat(), 'url': url}
          try:
              req = urllib.request.Request(url, headers={'Accept':'application/json','User-Agent':'RiadRevenueAgent/1.0'})
              with urllib.request.urlopen(req, timeout=30) as r:
                  raw = r.read().decode()
                  result['http_status'] = r.status
                  try:
                      data = json.loads(raw)
                  except Exception:
                      data = {'raw': raw[:50000]}
                  result['data'] = data
          except urllib.error.HTTPError as e:
              result['http_status'] = e.code
              result['error_body'] = e.read().decode(errors='replace')[:20000]
          except Exception as e:
              result['error'] = repr(e)

          with open('basedagents-scan.json','w') as f:
              json.dump(result, f, indent=2)
          PY
      - name: Commit scan
        run: |
          git config user.name "Riad Revenue Agent"
          git config user.email "actions@users.noreply.github.com"
          git add basedagents-scan.json
          git diff --cached --quiet && exit 0
          git commit -m "chore: refresh BasedAgents open tasks"
          git push
