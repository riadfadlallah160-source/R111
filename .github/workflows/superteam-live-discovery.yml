name: PrivacySafe Focused Security Audit

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Clone in-scope public server repo and extract high-risk code paths
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/PrivacySafe/spec-server.git target >/dev/null 2>&1
          cd target
          echo '=== TOP LEVEL ==='
          find . -maxdepth 2 -type f | sort | head -200
          echo '=== HIGH RISK MATCHES ==='
          python - <<'PY'
          import os,re
          pats = re.compile(r'(auth|session|token|cookie|origin|cors|authorization|bearer|password|login|verify|challenge|user.?id|path\.join|readFile|sendFile|exec\(|spawn\(|eval\(|innerHTML|deserialize)', re.I)
          exts={'.ts','.js','.tsx','.jsx','.mjs','.cjs','.py'}
          out=[]
          for root,dirs,files in os.walk('.'):
              dirs[:] = [d for d in dirs if d not in {'.git','node_modules','dist','build','coverage'}]
              for f in files:
                  if os.path.splitext(f)[1] not in exts: continue
                  p=os.path.join(root,f)
                  try: lines=open(p,encoding='utf-8',errors='ignore').read().splitlines()
                  except: continue
                  for i,line in enumerate(lines):
                      if pats.search(line):
                          a=max(0,i-2); b=min(len(lines),i+3)
                          out.append((p,i+1,'\n'.join(f'{j+1}: {lines[j]}' for j in range(a,b))))
          for p,n,s in out[:350]:
              print(f'--- {p}:{n} ---')
              print(s)
          print(f'TOTAL_MATCHES={len(out)}')
          PY
