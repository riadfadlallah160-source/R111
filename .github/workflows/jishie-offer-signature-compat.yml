name: Jishie offer signature compatibility
on:
  push:
    branches: [jishie-demand-probe]
    paths: ['.github/workflows/jishie-offer-signature-compat.yml']
permissions:
  contents: write
jobs:
  offer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: jishie-demand-probe }
      - shell: bash
        run: |
          set -euo pipefail
          mkdir -p data
          cat > /tmp/compat.mjs <<'JS'
          import crypto from 'node:crypto'; import fs from 'node:fs';
          const sort=v=>Array.isArray(v)?v.map(sort):(v&&typeof v==='object')?Object.fromEntries(Object.keys(v).sort().map(k=>[k,sort(v[k])])):v;
          const base={offer:'0.1',demand_id:'dmd_a101',seller:{domain:'fifty-million-agent-gateway.onrender.com',agent_card:'https://fifty-million-agent-gateway.onrender.com/.well-known/agent.json',index_ref:'aix_e13bf173d4'},price:{amount:0.20,currency:'USDC',model:'per_record'},capacity:{max_per_day:120},sla:{p95_ms:3000,uptime:0.99},settlement:{rail:'x402'},valid_until:'2026-10-25'};
          const results=[];
          const variants=[
            ['stable-core', (core,meta)=>JSON.stringify(sort(core))],
            ['plain-core', (core,meta)=>JSON.stringify(core)],
            ['stable-array-core', (core,meta)=>JSON.stringify(sort([core]))],
            ['plain-array-core', (core,meta)=>JSON.stringify([core])],
            ['stable-with-meta', (core,meta)=>JSON.stringify(sort({...core,signature:meta}))],
            ['plain-with-meta', (core,meta)=>JSON.stringify({...core,signature:meta})],
            ['stable-no-version', (core,meta)=>{const {offer,...rest}=core; return JSON.stringify(sort(rest));}],
            ['stable-offer-wrapper', (core,meta)=>JSON.stringify(sort({offer:core}))]
          ];
          for(const [name,make] of variants){
            const {publicKey,privateKey}=crypto.generateKeyPairSync('ed25519'); const jwk=publicKey.export({format:'jwk'});
            const meta={alg:'ed25519',keys_inline:{kty:'OKP',crv:'Ed25519',x:jwk.x},signed_at:new Date().toISOString()};
            const sig=crypto.sign(null,Buffer.from(make(base,meta)),privateKey).toString('base64');
            const body={...base,signature:{...meta,sig}};
            const r=await fetch('https://jishie.com/v1/demands/dmd_a101/offers',{method:'POST',headers:{'content-type':'application/json','accept':'application/json','user-agent':'50M-seller-signature-compat/1.0'},body:JSON.stringify(body)});
            const raw=await r.text(); let data; try{data=JSON.parse(raw)}catch{data={raw:raw.slice(0,4000)}}
            results.push({variant:name,status:r.status,response:data});
            if(r.status>=200&&r.status<300) break;
            if(r.status!==422 || !String(data?.error||'').toLowerCase().includes('signature')) break;
          }
          const out={at:new Date().toISOString(),results}; fs.writeFileSync('data/jishie-offer-signature-compat.json',JSON.stringify(out,null,2)); console.log(JSON.stringify(out,null,2));
          JS
          node /tmp/compat.mjs
      - run: |
          git config user.name "50M demand seller"
          git config user.email "actions@users.noreply.github.com"
          git add data/jishie-offer-signature-compat.json
          git diff --cached --quiet && exit 0
          git commit -m "chore: record Jishie signature compatibility"
          git push origin HEAD:jishie-demand-probe
