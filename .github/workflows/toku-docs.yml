name: Toku machine docs probe
on:
  push:
    branches: [toku-live-jobs]
    paths: ['.github/workflows/toku-docs.yml']
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: toku-live-jobs}
      - shell: bash
        run: |
          set -euo pipefail
          mkdir -p data
          python - <<'PY'
          import urllib.request,json,datetime
          paths=['/llms.txt','/.well-known/agent.json','/.well-known/agent-card.json','/docs','/api-docs','/skill.md']
          out={'at':datetime.datetime.now(datetime.timezone.utc).isoformat(),'results':[]}
          for p in paths:
            u='https://toku.agency'+p
            try:
              req=urllib.request.Request(u,headers={'User-Agent':'50M-agent/1.0','Accept':'application/json,text/plain,text/html'})
              with urllib.request.urlopen(req,timeout=20) as r:
                raw=r.read().decode('utf-8','replace')
              out['results'].append({'path':p,'status':r.status,'body':raw[:30000]})
            except urllib.error.HTTPError as e:
              out['results'].append({'path':p,'status':e.code,'body':e.read().decode('utf-8','replace')[:5000]})
            except Exception as e:out['results'].append({'path':p,'error':repr(e)})
          open('data/toku-docs.json','w').write(json.dumps(out,indent=2))
          print(json.dumps(out,indent=2)[:50000])
          PY
      - run: |
          git config user.name "50M Toku docs"
          git config user.email "actions@users.noreply.github.com"
          git add data/toku-docs.json
          git diff --cached --quiet && exit 0
          git commit -m "chore: record Toku machine docs"
          git push origin HEAD:toku-live-jobs
