name: Jishie offer API probe
on:
  push:
    branches: [jishie-demand-probe]
    paths: ['.github/workflows/jishie-offer-api.yml']
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: jishie-demand-probe }
      - shell: bash
        run: |
          set -euo pipefail
          mkdir -p data
          python - <<'PY'
          import urllib.request,json
          url='https://jishie.com/v1/openapi.json'
          req=urllib.request.Request(url,headers={'User-Agent':'50M-demand-probe/1.0','Accept':'application/json'})
          with urllib.request.urlopen(req,timeout=30) as r: spec=json.loads(r.read())
          paths={k:v for k,v in spec.get('paths',{}).items() if 'demand' in k or 'offer' in k}
          open('data/jishie-offer-api.json','w').write(json.dumps({'paths':paths},indent=2))
          print(json.dumps(paths,indent=2)[:50000])
          PY
      - run: |
          git config user.name "50M demand probe"
          git config user.email "actions@users.noreply.github.com"
          git add data/jishie-offer-api.json
          git diff --cached --quiet && exit 0
          git commit -m "chore: record Jishie offer API"
          git push origin HEAD:jishie-demand-probe
