name: Frantic live probe
on:
  push:
    branches: [frantic-live-probe]
    paths: ['.github/workflows/frantic-live-probe.yml']
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: frantic-live-probe }
      - shell: bash
        run: |
          set -euo pipefail
          mkdir -p data
          python - <<'PY'
          import urllib.request,json,datetime
          urls=['https://gofrantic.com/SKILL.md','https://gofrantic.com/v1/board']
          out={'at':datetime.datetime.now(datetime.timezone.utc).isoformat(),'results':[]}
          for url in urls:
            try:
              req=urllib.request.Request(url,headers={'User-Agent':'50M-frantic-probe/1.0','Accept':'*/*'})
              with urllib.request.urlopen(req,timeout=30) as r:
                raw=r.read().decode('utf-8','replace')
                try:data=json.loads(raw)
                except:data={'text':raw[:60000]}
                out['results'].append({'url':url,'status':r.status,'data':data})
            except Exception as e: out['results'].append({'url':url,'error':repr(e)})
          open('data/frantic-live.json','w').write(json.dumps(out,indent=2))
          print(json.dumps(out,indent=2)[:60000])
          PY
      - run: |
          git config user.name "50M live probe"
          git config user.email "actions@users.noreply.github.com"
          git add data/frantic-live.json
          git diff --cached --quiet && exit 0
          git commit -m "chore: record Frantic live board and skill"
          git push origin HEAD:frantic-live-probe
