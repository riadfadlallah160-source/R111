name: Payan live requests retry
on:
  push:
    branches: [payan-live-probe]
    paths: ['.github/workflows/payan-requests-retry.yml']
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: payan-live-probe}
      - shell: bash
        run: |
          set -euo pipefail
          mkdir -p data
          python - <<'PY'
          import urllib.request,json,datetime
          urls=['https://payanagent.com/api/v1/requests','https://payanagent.com/api/v1/receipts','https://payanagent.com/api/v1/offers?limit=5']
          out={'at':datetime.datetime.now(datetime.timezone.utc).isoformat(),'results':[]}
          for u in urls:
            try:
              req=urllib.request.Request(u,headers={'User-Agent':'50M-provider/1.0','Accept':'application/json'})
              with urllib.request.urlopen(req,timeout=30) as r:
                raw=r.read().decode('utf-8','replace')
                try:d=json.loads(raw)
                except:d={'raw':raw[:30000]}
                out['results'].append({'url':u,'status':r.status,'data':d})
            except urllib.error.HTTPError as e:
              raw=e.read().decode('utf-8','replace')
              try:d=json.loads(raw)
              except:d={'raw':raw[:10000]}
              out['results'].append({'url':u,'status':e.code,'data':d})
            except Exception as e:out['results'].append({'url':u,'error':repr(e)})
          open('data/payan-requests-retry.json','w').write(json.dumps(out,indent=2))
          print(json.dumps(out,indent=2)[:50000])
          PY
      - run: |
          git config user.name "50M Payan retry"
          git config user.email "actions@users.noreply.github.com"
          git add data/payan-requests-retry.json
          git diff --cached --quiet && exit 0
          git commit -m "chore: retry Payan live requests"
          git push origin HEAD:payan-live-probe
