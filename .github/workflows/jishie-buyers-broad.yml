name: Jishie broad buyer demand scan
on:
  push:
    branches: [jishie-demand-probe]
    paths: ['.github/workflows/jishie-buyers-broad.yml']
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: jishie-demand-probe}
      - shell: bash
        run: |
          set -euo pipefail
          mkdir -p data
          python - <<'PY'
          import urllib.request,json,datetime
          qs=['software development coding bug fix','API integration automation','web research analysis','web scraping data extraction','MCP server agent integration']
          out={'at':datetime.datetime.now(datetime.timezone.utc).isoformat(),'queries':[]}
          for idx,q in enumerate(qs,1):
            payload={'jsonrpc':'2.0','id':idx,'method':'message/send','params':{'message':{'role':'user','parts':[{'kind':'data','data':{'skill':'find_buyers_for_capability','q':q}}]}}}
            req=urllib.request.Request('https://jishie.com/a2a',data=json.dumps(payload).encode(),method='POST',headers={'User-Agent':'50M-seller/1.0','Accept':'application/json','Content-Type':'application/json'})
            try:
              with urllib.request.urlopen(req,timeout=30) as r:data=json.loads(r.read().decode()); status=r.status
            except urllib.error.HTTPError as e:
              status=e.code
              raw=e.read().decode('utf-8','replace')
              try:data=json.loads(raw)
              except:data={'raw':raw[:10000]}
            out['queries'].append({'q':q,'status':status,'data':data})
          open('data/jishie-buyers-broad.json','w').write(json.dumps(out,indent=2))
          print(json.dumps(out,indent=2)[:50000])
          PY
      - run: |
          git config user.name "50M broad buyer scan"
          git config user.email "actions@users.noreply.github.com"
          git add data/jishie-buyers-broad.json
          git diff --cached --quiet && exit 0
          git commit -m "chore: record broad Jishie buyer demand"
          git push origin HEAD:jishie-demand-probe
