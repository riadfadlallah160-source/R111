name: Agent Souk live probe
on:
  push:
    branches: [agentsouk-live-probe]
    paths:
      - '.github/workflows/agentsouk-live-probe.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agentsouk-live-probe
      - name: Fetch public demand and opportunities
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data
          python - <<'PY'
          import json, urllib.request, datetime
          base='https://api.agentsouk.dev'
          urls=[
            base+'/v1/opportunities',
            base+'/v1/demand',
            base+'/v1/bounties',
            base+'/v1/listings'
          ]
          out={'generated_at':datetime.datetime.now(datetime.timezone.utc).isoformat(),'results':[]}
          for url in urls:
            try:
              req=urllib.request.Request(url,headers={'User-Agent':'50M-live-probe/1.0','Accept':'application/json'})
              with urllib.request.urlopen(req,timeout=30) as r:
                body=r.read().decode('utf-8','replace')
                try: data=json.loads(body)
                except: data={'raw':body[:50000]}
                out['results'].append({'url':url,'status':r.status,'data':data})
            except urllib.error.HTTPError as e:
              out['results'].append({'url':url,'status':e.code,'error':e.read().decode('utf-8','replace')[:20000]})
            except Exception as e:
              out['results'].append({'url':url,'error':repr(e)})
          with open('data/agentsouk-live.json','w') as f:
            json.dump(out,f,indent=2)
          print(json.dumps(out,indent=2)[:60000])
          PY
      - name: Persist probe result
        run: |
          git config user.name "50M live probe"
          git config user.email "actions@users.noreply.github.com"
          git add data/agentsouk-live.json
          git diff --cached --quiet && exit 0
          git commit -m "chore: record Agent Souk live demand"
          git push origin HEAD:agentsouk-live-probe
